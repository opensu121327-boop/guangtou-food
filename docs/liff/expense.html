<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>記支出</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
@font-face{font-family:'Huninn';src:url('../jf-openhuninn.ttf') format('truetype');font-display:swap}
:root{
  --bg:#FFF4E6;--card:#FFFFFF;--soft:#FFF0DF;
  --burgundy:#800020;--gold:#C9A96E;--gold-deep:#9A7A4A;
  --text:#3A2417;--text-2:rgba(58,36,23,.66);--text-3:rgba(58,36,23,.42);
  --line:rgba(255,138,61,.30);--line-soft:rgba(120,80,40,.14);
  --red:#C0392B;
  --r-card:22px;--r-field:16px;--r-pill:99px;
  --shadow:0 10px 26px -14px rgba(180,90,20,.28),0 2px 0 rgba(255,138,61,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Huninn','Noto Sans TC',system-ui,sans-serif}
body{padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
header{padding:4px 2px 14px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--gold-deep)}
h1{margin:4px 0 2px;font-size:26px;color:var(--burgundy);font-weight:700}
.meta{font-size:13px;color:var(--text-2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(201,169,110,.6),transparent)}
.ttl{font-size:16px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1px solid var(--line-soft);background:#FFFCF7;color:var(--text);font:inherit;font-size:16px;padding:12px;border-radius:var(--r-field)}
.seg button.on{background:var(--burgundy);border-color:var(--burgundy);color:#fff;font-weight:700}
.need{border:2px dashed var(--red)}
.hint{font-size:12px;color:var(--text-3);margin-top:6px}
.datebox{position:relative;display:flex;align-items:center;justify-content:space-between;height:50px;border:1px solid var(--line-soft);background:#FFFCF7;border-radius:var(--r-field);padding:0 14px;font-size:16px}
.datebox .cal{font-size:13px;color:var(--gold-deep)}
.datebox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;-webkit-appearance:none;appearance:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--soft);color:var(--text);font:inherit;font-size:13px;padding:6px 11px;border-radius:var(--r-pill)}
.chip.on{background:var(--burgundy);border-color:var(--burgundy);color:#fff}
.chip small{color:var(--text-3);margin-left:4px}
.item .types{margin-bottom:10px}
.field{margin-top:8px}
.field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:4px}
.text{width:100%;border:1px solid var(--line-soft);background:#FFFCF7;border-radius:12px;padding:11px 12px;font:inherit;font-size:16px;color:var(--text);outline:none}
.text:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,169,110,.22)}
.two{display:flex;gap:8px}.two .field{flex:1;min-width:0}
.del{border:0;background:transparent;color:var(--text-3);font:inherit;font-size:13px}
.add{width:100%;border:1px dashed var(--gold);background:transparent;color:var(--gold-deep);font:inherit;font-size:16px;padding:13px;border-radius:var(--r-field);margin-bottom:12px}
.sum{background:var(--soft);border-style:dashed;box-shadow:none;display:flex;justify-content:space-between;align-items:center}
.sum b{font-size:24px;color:var(--burgundy)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,244,230,0),var(--bg) 30%)}
.submit{width:100%;border:0;border-radius:var(--r-pill);padding:15px;font:inherit;font-size:17px;font-weight:700;color:#fff;background:var(--burgundy);box-shadow:0 10px 24px -10px rgba(128,0,32,.6)}
.submit:disabled{opacity:.45}
.state{text-align:center;padding:56px 16px;color:var(--text-2);line-height:1.8}
.state .big{font-size:40px;margin-bottom:8px}
.state.err{color:var(--red)}
.hidden{display:none}
</style>
</head>
<body>
<div id="loading" class="state"><div class="big">⏳</div>載入中…</div>
<div id="error" class="state err hidden"></div>
<div id="done" class="state hidden"><div class="big">✅</div><div id="doneMsg"></div></div>

<form id="form" class="hidden" autocomplete="off">
  <header>
    <div class="eyebrow" id="eyebrow">記支出</div>
    <h1>記支出</h1>
    <div class="meta" id="who"></div>
  </header>

  <div id="storeCard" class="card hidden">
    <div class="ttl">哪一家店</div>
    <div class="seg" id="storeSeg"></div>
    <div class="hint" id="storeHint">請先選擇店別</div>
  </div>

  <div class="card">
    <div class="ttl">營業日</div>
    <div class="datebox"><span id="dateText"></span><span class="cal">更改日期 ▾</span><input type="date" id="date" aria-label="營業日"></div>
  </div>

  <div id="freqCard" class="card hidden">
    <div class="ttl">常用項目<span class="hint" style="margin:0">點一下加入</span></div>
    <div class="chips" id="freq"></div>
  </div>

  <div id="items"></div>
  <button type="button" class="add" id="addBtn">＋ 再加一筆</button>

  <div class="card sum"><span>合計</span><b id="sTotal">$0</b></div>

  <div class="bar"><button type="submit" class="submit" id="submitBtn">送出支出</button></div>
</form>

<template id="itemTpl">
  <div class="card item">
    <div class="ttl"><span class="no"></span><button type="button" class="del">刪除</button></div>
    <div class="chips types"></div>
    <div class="field"><label class="nameLbl">項目</label><input class="text name"></div>
    <div class="two">
      <div class="field"><label>金額</label><input class="text amount" inputmode="numeric" placeholder="0"></div>
      <div class="field"><label class="supLbl">付款對象</label><input class="text sup"></div>
    </div>
  </div>
</template>

<script>
const LIFF_ID = '2012008092-kvwtENd5';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzc58gQ0ttfjeqHNV1OYLdDZNyl5JqVvNPvO8tYqg8_Dgezslqp8BRuFR9cSeNjwDaT/exec';
const PH = {   // 各類型的提示文字
  salary: { name: '日薪／月薪／獎金／加班費', sup: '員工姓名（必填）', supLbl: '員工姓名' },
  util: { name: '電費／水費／瓦斯／網路', sup: '台電、自來水公司', supLbl: '付款對象' },
  rent: { name: '店面租金', sup: '房東', supLbl: '付款對象' },
  mkt: { name: '粉專廣告／傳單印刷', sup: 'Facebook、印刷廠', supLbl: '付款對象' },
  repair: { name: '冷氣維修／冰箱保養', sup: '維修廠商', supLbl: '付款對象' },
  other: { name: '項目名稱', sup: '付款對象', supLbl: '付款對象' }
};

const $ = id => document.getElementById(id);
let STORE = (function () {
  const q = new URLSearchParams(location.search);
  if (q.get('store')) return q.get('store');
  const st = q.get('liff.state');
  return st ? (new URLSearchParams(st.replace(/^[^?]*\?/, '')).get('store') || '') : '';
})();
let INFO = null;
const money = n => '$' + Math.round(n || 0).toLocaleString('en-US');
const num = s => { const n = Number(String(s).replace(/[,\s$]/g, '')); return isFinite(n) && n > 0 ? n : 0; };
function show(id) { ['loading', 'error', 'done', 'form'].forEach(x => $(x).classList.toggle('hidden', x !== id)); }
function fail(msg) { $('error').textContent = msg; show('error'); }

async function api(action, data) {
  const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, store: STORE, idToken: liff.getIDToken(), accessToken: liff.getAccessToken(), data }) });
  return res.json();
}

function showDate() {
  const v = $('date').value;
  if (!v) { $('dateText').textContent = '請選擇日期'; return; }
  const [y, m, d] = v.split('-').map(Number);
  $('dateText').textContent = y + '/' + String(m).padStart(2, '0') + '/' + String(d).padStart(2, '0') + '（週' + '日一二三四五六'.charAt(new Date(y, m - 1, d).getDay()) + '）';
}

function setType(card, key) {
  card.dataset.type = key;
  card.querySelectorAll('.types .chip').forEach(c => c.classList.toggle('on', c.dataset.k === key));
  const p = PH[key] || PH.other;
  card.querySelector('.name').placeholder = p.name;
  card.querySelector('.sup').placeholder = p.sup;
  card.querySelector('.supLbl').textContent = p.supLbl;
}

function renumber() {
  const cards = [...document.querySelectorAll('#items .item')];
  cards.forEach((c, i) => { c.querySelector('.no').textContent = '第 ' + (i + 1) + ' 筆'; c.querySelector('.del').classList.toggle('hidden', cards.length === 1); });
  calc();
}

function addItem(pre) {
  pre = pre || {};
  const card = $('itemTpl').content.firstElementChild.cloneNode(true);
  INFO.types.forEach(t => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip'; b.dataset.k = t.key; b.textContent = t.label;
    b.addEventListener('click', () => setType(card, t.key));
    card.querySelector('.types').appendChild(b);
  });
  card.querySelector('.name').value = pre.name || '';
  card.querySelector('.sup').value = pre.sup || '';
  if (pre.last) card.querySelector('.amount').placeholder = '上次 ' + pre.last;
  card.querySelector('.amount').addEventListener('input', calc);
  card.querySelector('.del').addEventListener('click', () => { card.remove(); renumber(); });
  setType(card, pre.type || 'util');
  // 若第一筆還是空白，常用項目直接填進去
  const first = document.querySelector('#items .item');
  if (pre.name && first && !first.querySelector('.name').value && !first.querySelector('.amount').value && !first.querySelector('.sup').value) first.remove();
  $('items').appendChild(card);
  renumber();
  if (pre.name) card.querySelector('.amount').focus();
}

function calc() {
  const t = [...document.querySelectorAll('#items .amount')].reduce((s, i) => s + num(i.value), 0);
  $('sTotal').textContent = money(t);
  return t;
}

function renderStores() {
  const many = INFO.stores.length > 1;
  $('storeCard').classList.toggle('hidden', !many);
  const cur = INFO.stores.find(s => s.key === STORE);
  $('eyebrow').textContent = (cur ? cur.name + '｜' : '') + '記支出';
  $('storeHint').classList.toggle('hidden', !!STORE);
  $('storeCard').classList.toggle('need', many && !STORE);
  const seg = $('storeSeg'); seg.innerHTML = '';
  INFO.stores.forEach(s => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = s.name; b.className = s.key === STORE ? 'on' : '';
    b.addEventListener('click', () => load(s.key));
    seg.appendChild(b);
  });
  $('submitBtn').disabled = !STORE;
  $('submitBtn').textContent = STORE ? '送出支出' : '請先選擇店別';
  const freq = INFO.frequent || [];
  $('freqCard').classList.toggle('hidden', !freq.length);
  $('freq').innerHTML = '';
  freq.forEach(f => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
    b.innerHTML = ''; b.append(f.name.replace(/^員工薪水$/, '薪水')); if (f.sup && f.type === 'salary') { const s = document.createElement('small'); s.textContent = f.sup; b.appendChild(s); }
    b.addEventListener('click', () => addItem(f.type === 'salary' ? { type: 'salary', name: '薪資', sup: f.sup, last: f.last } : f));
    $('freq').appendChild(b);
  });
}

async function load(key) {
  STORE = key || '';
  const info = await api('liff_exp_init');
  if (!info.ok) { fail(info.error || '載入失敗'); return null; }
  INFO = info; STORE = info.store || '';
  $('who').textContent = info.today + '（' + info.weekday + '）營業日｜填寫人：' + info.name;
  if (!$('date').value) { $('date').value = info.today.replace(/\//g, '-'); showDate(); }
  renderStores();
  if (!document.querySelector('#items .item')) addItem();
  return info;
}

async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    if (!liff.getIDToken() && !liff.getAccessToken()) return fail('LINE 沒有提供身分憑證，請關閉後重新開啟。');
    if (!(await load(STORE))) return;
    $('date').addEventListener('change', showDate);
    $('addBtn').addEventListener('click', () => addItem());
    show('form');
  } catch (e) { fail('無法開啟表單：' + (e && e.message || e)); }
}

$('form').addEventListener('submit', async ev => {
  ev.preventDefault();
  if (!STORE) return alert('請先選擇店別');
  const items = [...document.querySelectorAll('#items .item')].map(c => ({
    type: c.dataset.type, name: c.querySelector('.name').value.trim(), amount: num(c.querySelector('.amount').value), sup: c.querySelector('.sup').value.trim()
  })).filter(x => x.name || x.amount || x.sup);
  if (!items.length) return alert('請至少填一筆支出');
  for (let i = 0; i < items.length; i++) {
    const x = items[i];
    if (!x.amount) return alert('第 ' + (i + 1) + ' 筆請填金額');
    if (x.type === 'salary' && !x.sup) return alert('第 ' + (i + 1) + ' 筆薪資請填員工姓名');
    if (x.type !== 'salary' && !x.name) return alert('第 ' + (i + 1) + ' 筆請填項目名稱');
  }
  const store = INFO.stores.find(s => s.key === STORE).name;
  if (!confirm('【' + store + '】' + $('dateText').textContent + '\n共 ' + items.length + ' 筆，合計 ' + money(calc()) + '\n確定送出？')) return;
  const btn = $('submitBtn'); btn.disabled = true; btn.textContent = '送出中…';
  try {
    const r = await api('liff_exp_submit', { date: $('date').value, items });
    if (!r.ok) throw new Error(r.error || '送出失敗');
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const list = r.items.map(x => esc(x.name + (x.sup ? '（' + x.sup + '）' : '')) + ' ' + money(x.total)).join('<br>');
    $('doneMsg').innerHTML = '【' + r.store + '】' + r.date + ' 支出已入帳<br><b style="font-size:24px;color:#800020">' + money(r.total) +
      '</b><br><span style="font-size:13px">' + list + '</span><br><span style="font-size:12px">打錯了？30 分鐘內在聊天室輸入「撤回」</span>';
    show('done');
    setTimeout(() => { if (liff.isInClient()) liff.closeWindow(); }, 5000);
  } catch (e) { alert(e.message || e); btn.disabled = false; btn.textContent = '送出支出'; }
});

main();
</script>
</body>
</html>
